name: CI

# Catches a broken build before it reaches a release tag.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: go test ./...

      # Vet AND build every target platform, not just the runner's own. The
      # socket options are per-OS behind build tags, so a mistake in one of
      # them is invisible unless each GOOS is checked explicitly.
      - name: Vet and build all targets
        run: |
          for target in darwin/arm64 windows/amd64 linux/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "::group::$os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go vet ./...
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build ./...
            echo "::endgroup::"
          done

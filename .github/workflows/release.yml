name: Release

# Tagging a version is the only action needed to publish a build:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# That builds both binaries and attaches them to the Releases page.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The tool is pure Go with CGO disabled, so one Linux runner can produce
      # both binaries. If a native GUI toolkit is added later this becomes a
      # matrix across macos-14 and windows-latest.
      - name: Build binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=$GITHUB_REF_NAME"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/ipreporter-macos-arm64 ./cmd/ipreporter
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/ipreporter-windows-x64.exe ./cmd/ipreporter
          ls -lh dist/

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

name: Release

# Tagging a version is the only action needed to publish a build:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# That builds the command-line capture tool and the desktop app for both
# platforms, and attaches them all to the Releases page.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The command-line capture tool, published as "capture-tool" so it cannot be
  # mistaken for the application next to it on the Releases page. That is not a
  # distinction anyone should have to make while standing in a container.
  #
  # Pure Go with CGO disabled, so one Linux runner produces both binaries.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=$GITHUB_REF_NAME"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/capture-tool-macos-arm64 ./cmd/capture-tool
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" \
            -o dist/capture-tool-windows-x64.exe ./cmd/capture-tool
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/

  # The desktop app embeds a system webview, which needs CGO, which means it
  # cannot be cross-compiled. Each platform builds on its own runner.
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/arm64
            # Wails emits a .app bundle on macOS; zip it so the Releases page
            # serves a single file that survives the download intact.
            package: |
              cd gui/build/bin
              ditto -c -k --keepParent OpenIPReporter.app ../../../dist/OpenIPReporter-macos-arm64.zip
          - os: windows-latest
            platform: windows/amd64
            package: |
              mkdir -p dist
              cp gui/build/bin/OpenIPReporter.exe dist/OpenIPReporter-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Build app
        working-directory: gui
        # bash on both runners on purpose: the default shell on Windows is
        # PowerShell, where $GITHUB_REF_NAME is an undefined variable rather
        # than the environment variable, and the app would be stamped with an
        # empty version — which silently disables its update check.
        shell: bash
        run: wails build -platform ${{ matrix.platform }} -ldflags "-X main.version=$GITHUB_REF_NAME"

      - name: Package
        shell: bash
        run: ${{ matrix.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: dist/

  publish:
    needs: [cli, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect and checksum
        run: |
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS.txt && ls -lh && cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

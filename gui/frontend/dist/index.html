<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenIPReporter</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<main class="window">

  <!-- The position boxes are both the display and the control: they show
       where the next machine will land, and typing in them moves the walk. -->
  <section class="controls">
    <div class="field">
      <label for="can">Can</label>
      <div class="can-row">
        <select id="can"></select>
        <button id="editcans" class="tool" title="Add or edit the cans at this site">Cans…</button>
      </div>
    </div>
    <div class="field narrow">
      <label for="rack">Rack</label>
      <input id="rack" type="number" min="1" max="20" value="1">
    </div>
    <div class="field narrow">
      <label for="row">Row</label>
      <input id="row" type="number" min="1" value="1">
    </div>
    <div class="field narrow">
      <label for="column">Column</label>
      <input id="column" type="number" min="1" value="1">
    </div>
    <button id="startstop" class="start">Start <span class="glyph">&#9655;</span></button>
  </section>

  <section class="card">
    <header class="card-head">
      <svg class="icon" viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="9" cy="9" r="7"/>
        <path d="M2 9h14M9 2c4 4 4 10 0 14M9 2C5 6 5 12 9 16"/>
      </svg>
      <h2>Device Information</h2>

      <div class="tools">
        <button id="undo" class="tool" title="Undo (Ctrl+Z)">Undo</button>
        <button id="redo" class="tool" title="Redo (Ctrl+Y)">Redo</button>
        <span class="tool-sep"></span>
        <button id="export" class="tool">Export CSV</button>
      </div>
    </header>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th class="c-no">No.</th>
            <th class="c-rc">Row</th>
            <th class="c-rc">Column</th>
            <th class="c-ip">IP Address</th>
            <th class="c-mac">MAC Address</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty">Press a miner's IP&#8209;report button to begin.</p>
    </div>

    <footer class="status">
      <span id="status-text">0 Devices Connected</span>
      <span id="status-hint" class="status-hint"></span>
    </footer>
  </section>
</main>

<!-- Set up once per site. Deliberately out of the walking screen. -->
<div id="cansdlg" class="overlay hidden">
  <div class="dialog">
    <header class="dlg-head">
      <h2>Cans at this site</h2>
      <p>The rack shape for each can. Saved to <code>cans.json</code> next to the
         app — copy that file to set up another machine the same way.</p>
    </header>

    <div class="dlg-body">
      <table class="cans-table">
        <thead>
          <tr><th>Can</th><th class="n">Rows</th><th class="n">Columns</th><th class="n">Positions</th><th></th></tr>
        </thead>
        <tbody id="cansrows"></tbody>
      </table>
      <button id="addcan" class="tool addcan">+ Add a can</button>
    </div>

    <footer class="dlg-foot">
      <span id="cans-error" class="dlg-err"></span>
      <button id="cans-cancel" class="tool">Cancel</button>
      <button id="cans-save" class="primary-sm">Save</button>
    </footer>
  </div>
</div>

<!-- Right-click a row. Everything here is also on a key. -->
<div id="ctx" class="menu hidden">
  <button data-act="copyip">Copy IP address<span class="menu-val" id="ctx-ip"></span></button>
  <button data-act="copymac">Copy MAC address<span class="menu-val" id="ctx-mac"></span></button>
  <div class="menu-sep"></div>
  <button data-act="mac">Edit MAC address…</button>
  <button data-act="pos">Set position…</button>
  <button data-act="note">Edit note…</button>
  <div class="menu-sep"></div>
  <button data-act="insert">Insert blank above</button>
  <button data-act="delete">Delete row</button>
</div>

<script src="/wails/runtime.js"></script>
<script src="app.js"></script>
</body>
</html>
